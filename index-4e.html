<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>CBTA DGR Assessment 4.1.E (KSA)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Code+Pro:wght@500&display=swap">
<style>
/* Layout: DG acceptance workplace. Sticky control strip (timer + stage rail), one task card at a time, forms drawn like real DG paperwork. */
:root{
  /* ATC brand: navy text, royal blue (logo "A"), sky blue (logo aircraft), cool grey (logo swoosh) */
  --ink:#0d1450; --paper:#f4f6fa; --card:#ffffff; --line:#d6dce8; --muted:#4f5b75;
  --accent:#0a1aa8; --accent-ink:#ffffff; --sky:#009fe8; --hatch:#c8102e;
  --k:#0a1aa8; --s:#00799e; --a:#6b3fa0;
  --ok:#1b6e3a; --ok-bg:#e4f2e9; --bad:#b3261e; --bad-bg:#fbe7e5; --warn-bg:#fff4dc;
  --chip:#e9eef7;
  --f-display:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-mono:"Source Code Pro",Consolas,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
#modeTabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px}
#modeTabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:0;line-height:1.2;text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:clamp(26px,4vw,32px)} h2{font-size:24px} h3{font-size:19px}
p{margin:0} .muted{color:var(--muted)} .mono{font-family:var(--f-mono)}
.eyebrow{font:700 15px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--sky)}
.stack{display:flex;flex-direction:column;gap:14px} .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.btn{font:600 15px var(--f-body);border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer}
.btn:hover{border-color:var(--ink)} .btn:focus-visible,select:focus-visible,input:focus-visible,.opt:focus-visible,.fld:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],textarea,select{font:15px var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
label.lbl{font-weight:600;font-size:13px;display:block;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--f-body);padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--ink);white-space:nowrap}
.tag.K{background:var(--k);color:var(--card)} .tag.S{background:var(--s);color:var(--card)} .tag.A{background:var(--a);color:var(--card)}
/* top strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);color:var(--ink);border-bottom:3px solid var(--sky);box-shadow:0 1px 4px rgba(13,20,80,.06)}
.strip .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.strip .brand{display:flex;align-items:center;gap:14px;min-width:0}
.strip .brand img{height:58px;width:auto;display:block}
.strip .brand .bt{display:flex;flex-direction:column;line-height:1.25;border-left:1px solid var(--line);padding-left:14px}
.strip .brand .bt b{font-size:22px;color:var(--ink)}
.strip .brand .bt span{font-size:16px;font-weight:600;color:var(--muted);margin-top:2px}
@media (max-width:640px){.strip .brand{gap:10px}.strip .brand .bt{padding-left:10px}.strip .brand .bt b{font-size:16px}.strip .brand .bt span{font-size:13px}.strip .brand img{height:40px}}
.timer{margin-left:auto;font:600 22px var(--f-mono);font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ink)}
.timer.low{background:var(--bad);color:#fff;border-color:var(--bad)}
.rail{display:flex;gap:4px;width:100%}
.rail span{flex:1;height:5px;border-radius:3px;background:var(--chip)}
.rail span.done{background:var(--accent)} .rail span.cur{background:var(--sky)}
/* items */
.q{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.q:first-child{border-top:0;padding-top:0}
.qhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.qtext{font-weight:600;min-width:0;flex:1 1 300px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:16px/1.45 var(--f-body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer;width:100%}
.opt .k{font:600 13px var(--f-mono);color:var(--muted);min-width:18px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));box-shadow:inset 0 0 0 1px var(--accent)}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.lab{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--card)}
.lab img{height:120px;width:auto;object-fit:contain}
.lab select{font-size:14px}
/* DG forms */
.form{position:relative;background:#fff;color:#111;border-radius:4px;padding:18px 26px;font-size:13px;overflow:hidden}
.form.dgd{border:12px solid transparent;border-image:repeating-linear-gradient(45deg,var(--hatch) 0 8px,#fff 8px 16px) 12}
.form.awb{border:2px solid #333}
.form h4{font:700 15px var(--f-body);margin:0 0 10px;text-transform:uppercase;letter-spacing:.03em}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{border:1px solid #9aa3ad;border-radius:3px;padding:6px 8px;background:#fff;color:#111;font:13px var(--f-body);text-align:left;cursor:pointer;position:relative;width:100%}
.fld small{display:block;font-size:10px;text-transform:uppercase;color:#555;letter-spacing:.04em}
.fld .v{font-family:var(--f-mono);font-size:13px}
.fld.flag{background:#fff0f0;border-color:#c8102e;box-shadow:inset 0 0 0 2px #c8102e}
.fld.flag::after{content:"FLAGGED";position:absolute;top:4px;right:6px;font:700 10px var(--f-mono);color:#c8102e}
.fld.span2{grid-column:1/-1}
.stamp{display:inline-block;border:2px dashed #999;color:#888;padding:2px 8px;font-size:11px;transform:rotate(-4deg)}
.pkg{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:start}
.pkg img{border-radius:8px;border:1px solid var(--line);width:100%;height:auto}
.scale{display:inline-flex;gap:8px;align-items:baseline;background:#111;color:#7CFC9A;font:600 22px var(--f-mono);padding:6px 12px;border-radius:6px}
.scale small{font-size:11px;color:#aaa}
.note{background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:14px}
.bubble{background:var(--chip);border-radius:12px 12px 12px 2px;padding:12px 14px;max-width:640px}
.bubble b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.order li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card)}
.order{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.order .n{font:600 14px var(--f-mono);width:22px;color:var(--accent)}
.order .t{flex:1;min-width:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile .big{font:700 30px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.grid2>*{min-width:0}
.hero{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.waitdots{display:flex;gap:8px;justify-content:center;margin-top:8px}.waitdots span{width:10px;height:10px;border-radius:50%;background:var(--sky);animation:wd 1.2s infinite ease-in-out}.waitdots span:nth-child(2){animation-delay:.2s}.waitdots span:nth-child(3){animation-delay:.4s}@keyframes wd{0%,80%,100%{opacity:.25}40%{opacity:1}}
.hero .eyebrow{color:var(--sky);font-size:17px}
.hero .labelrow{display:flex;gap:6px}
.hero .labelrow img{width:60px;height:60px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:600 14px var(--f-body);padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs a{font:600 14px var(--f-body);padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.tabs a:hover{border-color:var(--ink)}
.tabs .cnt{background:var(--warn-bg);border-radius:99px;padding:0 8px;font-size:12px}
.tabs.tsw button[aria-selected=true]{cursor:default}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
svg text{font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
details summary{cursor:pointer;font-weight:600}
.pillbig{font:700 20px var(--f-display);letter-spacing:.04em;padding:14px 20px;border-radius:10px;text-align:center}
.pillbig.ok{background:var(--ok-bg);color:var(--ok)}.pillbig.bad{background:var(--bad-bg);color:var(--bad)}
.pill.wait{background:var(--warn-bg);color:var(--ink)}
.switch{display:inline-flex;gap:8px;align-items:center;font-weight:600}
.switch input{width:20px;height:20px}
ul.plane{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.plane li{position:relative;padding-left:26px}
ul.plane li::before{content:"✈";position:absolute;left:0;top:0;color:var(--accent);font-size:15px}
.nopic{display:grid;place-items:center;min-height:120px;border:1px dashed var(--line);border-radius:8px;background:var(--chip);color:var(--muted);font-size:13px;text-align:center;padding:10px}
.pkg .pair{display:flex;gap:8px}.pkg .pair img{width:50%;min-width:0}
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:12px}
.sheet .top{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center}
.sheet .top img{width:110px;height:auto}
.sheet .t1{font:700 17px var(--f-body);text-align:center}
.sheet .t2{font:700 19px var(--f-body);color:#1f3864;text-align:center}
.sheet table{font-size:13px;color:#111}
.sheet td,.sheet th{border:1px solid #9aa3ad;padding:5px 8px}
.sheet td.k{background:#dbe9f6;font-weight:700;width:34%}
.sheet th.r{color:#c00000;text-align:center;background:#f2f2f2;text-transform:none;letter-spacing:0;font-size:13px}
.sheet tr.hit td{background:#fff3cd;font-weight:700}
.sheet .foot{font-size:11px;font-style:italic;text-align:center;color:#444}
@media (max-width:640px){.pkg{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.form{padding:12px}}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="strip"><div class="in">
  <div class="brand"><img id="brandLogo" alt="Aviation Training Center"><div class="bt"><b>CBTA Dangerous Goods Regulations Assessment (KSA)</b><span>GCAA CAR Part VI · Table 4.1.E · IATA Function 7.4</span></div></div>
  <div id="modeTabs" hidden></div>
  <div class="timer" id="timer" hidden>30:00</div>
  <div class="rail" id="rail" hidden></div>
</div></div>
<main class="wrap" id="app"></main>

/* ---------- scoring ---------- */
function score(){
  const it={}; const crit=[];
  LABELS.forEach(l=>it[l.id]=(+S.ans[l.id]===l.ans)?2:0);
  STORE.forEach(w=>it[w.id]=(S.ans[w.id]!==undefined&&S.ans[w.id]!==""&&+S.ans[w.id]===w.ans)?2:0);
  for(const [id,m] of Object.entries(MCQ)) it[id]=(S.ans[id]!==undefined&&+S.ans[id]===m.a)?m.pts:0;
  SEG.forEach(g=>it[g.id]=(S.ans[g.id]===(g.ans?"y":"n"))?1:0);
  DOS.forEach(x=>it[x.id]=(S.ans[x.id]===(x.ans?"y":"n"))?1:0);
  DIALOG.forEach(d=>{const c=S.ans[d.id];const o=d.o[c];it[d.id]=o?o.p:0;if(o&&o.c)crit.push(d.id+": "+o.t)});
  it.ORD=S.order.reduce((s,v,i)=>s+(v===i?1:0),0);
  const ksa={K:0,S:0,A:0}; const st={};STAGES.forEach(x=>st[x.n]=0);
  ITEMS.forEach(i=>{ksa[i.ksa]+=it[i.id]||0; st[i.st]+=it[i.id]||0});
  const total=Object.values(ksa).reduce((a,b)=>a+b,0);
  const pct=Math.round(total/TOTAL*100);
  const b=band(pct); const competent=(b==="Distinction"||b==="Competent") && crit.length===0;
  const grade=crit.length&&(b==="Distinction"||b==="Competent")?"Re-sit":b;
  return {items:it,ksa,st,total,pct,crit,wrongFlags:0,competent,grade,band:b,attitude:crit.length?"Not acceptable":"Acceptable"};
}

/* ---------- charts (inline SVG) ---------- */
function donut(pct,label,color){
  const r=52,c=2*Math.PI*r,d=c*pct/100;
  return `<svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="${label} ${pct}%"><circle cx="70" cy="70" r="${r}" style="fill:none;stroke:var(--chip)" stroke-width="14"/><circle cx="70" cy="70" r="${r}" style="fill:none;stroke:${color}" stroke-width="14" stroke-dasharray="${d} ${c}" transform="rotate(-90 70 70)" stroke-linecap="butt"/><line x1="70" y1="4" x2="70" y2="24" style="stroke:currentColor" stroke-width="2" transform="rotate(${PASS*3.6} 70 70)"/><text x="70" y="72" text-anchor="middle" style="fill:currentColor;font:700 30px var(--f-display)">${pct}%</text><text x="70" y="92" text-anchor="middle" style="fill:currentColor;opacity:.7;font-size:11px">${label}</text></svg>`;
}
function hbars(rows,{max=100,mark=PASS,unit="%",lw=150}={}){
  // rows: [{label,value,color,sub}]
  const W=560,bh=22,gap=12,H=rows.length*(bh+gap)+28,x0=lw,x1=W-95;
  const sx=v=>x0+(x1-x0)*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img">`;
  [0,25,50,75,100].forEach(t=>{const tv=t*max/100;s+=`<line x1="${sx(tv)}" x2="${sx(tv)}" y1="0" y2="${H-22}" style="stroke:var(--line)"/><text x="${sx(tv)}" y="${H-6}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${Math.round(tv)}${unit}</text>`});
  rows.forEach((r,i)=>{const y=i*(bh+gap)+4;s+=`<text x="${lw-10}" y="${y+bh/2+4}" text-anchor="end" style="fill:var(--ink);font-size:13px">${esc(r.label)}</text><rect x="${x0}" y="${y}" width="${x1-x0}" height="${bh}" rx="3" style="fill:var(--chip)"/><rect x="${x0}" y="${y}" width="${Math.max(0,sx(r.value)-x0)}" height="${bh}" rx="3" style="fill:${r.color}"/><text x="${sx(r.value)+6}" y="${y+bh/2+4}" style="fill:var(--ink);font-size:12px;font-weight:600">${r.sub??Math.round(r.value)+unit}</text>`});
  if(mark!=null){s+=`<line x1="${sx(mark)}" x2="${sx(mark)}" y1="0" y2="${H-22}" style="stroke:var(--bad)" stroke-width="2" stroke-dasharray="4 3"/><text x="${sx(mark)+4}" y="10" style="fill:var(--bad);font-size:11px;font-weight:600">pass ${mark}${unit}</text>`}
  return s+"</svg>";
}
function stackedStages(){
  const W=640,lw=210,bh=20,gap=10,H=STAGES.length*(bh+gap)+30,x0=lw,x1=W-40,max=25;
  const sx=v=>(x1-x0)*v/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Points per stage split by K, S and A">`;
  [0,5,10,15,20,25].forEach(t=>{s+=`<line x1="${x0+sx(t)}" x2="${x0+sx(t)}" y1="0" y2="${H-22}" style="stroke:var(--line)"/><text x="${x0+sx(t)}" y="${H-6}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${t}</text>`});
  STAGES.forEach((stg,i)=>{const y=i*(bh+gap)+4;let x=x0;s+=`<text x="${lw-10}" y="${y+bh/2+4}" text-anchor="end" style="fill:var(--ink);font-size:13px">${stg.n}. ${esc(stg.title)}</text>`;
    ["K","S","A"].forEach(k=>{const v=ITEMS.filter(it=>it.st===stg.n&&it.ksa===k).reduce((a,b)=>a+b.pts,0);if(v){s+=`<rect x="${x}" y="${y}" width="${sx(v)-1}" height="${bh}" style="fill:var(--${k.toLowerCase()})"/>`;if(sx(v)>18)s+=`<text x="${x+sx(v)/2}" y="${y+bh/2+4}" text-anchor="middle" style="fill:var(--card);font-size:11px;font-weight:600">${v}</text>`;x+=sx(v)}});
    s+=`<text x="${x+5}" y="${y+bh/2+4}" style="fill:var(--muted);font-size:12px">${STAGE_MAX[stg.n]}</text>`});
  return s+"</svg>";
}
function timeline(){
  const W=620,H=86,x0=26,x1=W-30,sx=m=>x0+(x1-x0)*m/30;
  const segs=[{t:"B",m:1,c:"var(--muted)"},...STAGES.map(s=>({t:s.n+". "+s.title,m:s.mins,c:"var(--accent)"})),{t:"Debrief",m:0}];
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="30 minute timeline">`;let m=0;
  segs.forEach((g,i)=>{if(!g.m)return;const a=sx(m),b=sx(m+g.m);s+=`<rect x="${a}" y="14" width="${b-a-2}" height="26" rx="3" style="fill:${g.c};opacity:${i%2?1:.75}"/><text x="${(a+b)/2}" y="31" text-anchor="middle" style="fill:var(--card);font-size:11px;font-weight:600">${g.t.split(".")[0]}</text>`;m+=g.m});
  for(let t=0;t<=30;t+=5)s+=`<line x1="${sx(t)}" x2="${sx(t)}" y1="44" y2="50" style="stroke:var(--muted)"/><text x="${sx(t)}" y="64" text-anchor="middle" style="fill:var(--muted);font-size:11px">${t} min</text>`;
  return s+"</svg>";
}

  if(t.dataset.del){if(!t.dataset.confirm){t.dataset.confirm="1";t.textContent="Tap again to delete for good";return}

function pdfFooter(doc){

  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(...GREY);doc.setFont("helvetica","italic");doc.text(doc.splitTextToSize(PROPRIETARY,150),14,H-10);doc.setFont("helvetica","normal");doc.text("Page "+i+" of "+n,W-14,H-8,{align:"right"})}

function pdfBars(doc,x,y,rows){ // rows [{label,pct,color,sub}]
  const bw=110,bh=6;doc.setFontSize(9);
  rows.forEach((r,i)=>{const yy=y+i*10;doc.setTextColor(0,0,0);doc.text(r.label,x,yy+4.5);
    doc.setFillColor(232,237,244);doc.rect(x+38,yy,bw,bh,"F");doc.setFillColor(...r.color);doc.rect(x+38,yy,bw*Math.min(100,r.pct)/100,bh,"F");
    doc.text(r.sub,x+38+bw+3,yy+4.5)});
  const mx=x+38+bw*0.8;doc.setDrawColor(179,38,30);doc.setLineDashPattern([1,1],0);doc.line(mx,y-2,mx,y+rows.length*10-2);doc.setLineDashPattern([],0);
  doc.setFontSize(7);doc.setTextColor(179,38,30);doc.text("pass 80%",mx+1,y-3);doc.setTextColor(0,0,0);
  return y+rows.length*10;
}

    body:ITEMS.filter(i=>i.pts>0||i.id==="DOC_PEN").map(i=>[i.id,i.what.length>120?i.what.slice(0,117)+"...":i.what,i.ksa,i.task,((a.items||{})[i.id]??0)+" / "+i.pts])});
  y=doc.lastAutoTable.finalY+8;if(y>255){doc.addPage();y=20}
  doc.setFontSize(9);[["Assessor name",14],["Assessor signature",80],["Date",150]].forEach(([l,x])=>{doc.line(x,y+8,x+56,y+8);doc.text(l,x,y+12)});

}

  let y=doc.lastAutoTable.finalY+8;doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Class average by KSA",14,y);doc.setFont("helvetica","normal");
  y=pdfBars(doc,14,y+6,[["K","Knowledge",KC],["S","Skill",SC],["A","Attitude",AC]].map(([k,l,c])=>{const p=n?Math.round(A.reduce((s,a)=>s+a.ksa[k],0)/n/KSA_MAX[k]*100):0;return {label:l,pct:p,color:c,sub:p+"%"}}));
  doc.autoTable({startY:y+4,head:[["Name","Job title","Company / Dept","Submitted","Score","K","S","A","Result"]],headStyles:{fillColor:NAVY},styles:{fontSize:8.5},
    body:A.map(a=>[a.name||"",a.job||a.staff||"",a.company||"",fdate(a.submitted),a.pct+"%",a.ksa.K+"/"+KSA_MAX.K,a.ksa.S+"/"+KSA_MAX.S,a.ksa.A+"/"+KSA_MAX.A,a.grade+((a.crit&&a.crit.length)?" (unsafe choice)":"")]),
    didParseCell:d=>{if(d.section==="body"&&d.column.index===8){d.cell.styles.textColor=A[d.row.index].competent?[29,122,62]:[179,38,30];d.cell.styles.fontStyle="bold"}}});
  A.forEach(a=>{doc.addPage();coverPage(doc,a);doc.addPage();studentPage(doc,a)});
  pdfFooter(doc);doc.save("DG_4.1E_Class_Results_"+new Date().toISOString().slice(0,10)+".pdf");
}
